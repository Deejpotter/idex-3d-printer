#  IDEX macros - toolchange, copy and mirror modes, start/end
#  -----------------------------------------------------------
#  Klipper drives IDEX through SET_DUAL_CARRIAGE and ACTIVATE_EXTRUDER.
#  CARRIAGE=0 is toolhead A (stepper_x), CARRIAGE=1 is toolhead B
#  (dual_carriage). MODE can be PRIMARY, COPY or MIRROR.

[gcode_macro T0]
description: Select toolhead A (left)
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=INACTIVE
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_GCODE_OFFSET X=0 Y=0 Z=0

[gcode_macro T1]
description: Select toolhead B (right)
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=INACTIVE
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    # Measure these on the real machine with a calibration print, then set them.
    SET_GCODE_OFFSET X=0 Y=0 Z=0

[gcode_macro COPY_MODE]
description: Both heads print the same part - two copies in one print time
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G28 X
    G1 X0 F6000
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    G1 X130 F6000
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=COPY
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    RESPOND MSG="Copy mode active - usable width is now 115 mm per copy"

[gcode_macro MIRROR_MODE]
description: Both heads print mirrored parts - a left and a right hand version
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G28 X
    G1 X0 F6000
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    G1 X230 F6000
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=MIRROR
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    RESPOND MSG="Mirror mode active"

[gcode_macro END_MULTI_MODE]
description: Leave copy or mirror mode and go back to single-head printing
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=
    T0

[gcode_macro PARK_BOTH]
description: Send both carriages to their park positions
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    G1 X265 F9000
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G1 X-35 F9000

[gcode_macro G32]
description: Home everything and park
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G28 X
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    G28 X
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G28 Y
    G28 Z
    PARK_BOTH

[gcode_macro PRINT_START]
description: Expects BED, EXTRUDER and TOOL from the slicer
gcode:
    {% set bed  = params.BED|default(60)|float %}
    {% set hot  = params.EXTRUDER|default(210)|float %}
    {% set tool = params.TOOL|default(0)|int %}
    M140 S{bed}
    G32
    M190 S{bed}
    {% if tool == 1 %}
        T1
    {% else %}
        T0
    {% endif %}
    M109 S{hot}
    G90
    G92 E0
    RESPOND MSG="Printing with toolhead {tool}"

[gcode_macro PRINT_END]
gcode:
    M400
    G91
    G1 E-3 F2700
    G1 Z10 F900
    G90
    TURN_OFF_HEATERS
    SET_FAN_SPEED FAN=fan_part_A SPEED=0
    SET_FAN_SPEED FAN=fan_part_B SPEED=0
    PARK_BOTH
    G1 Y230 F6000
    M84

[gcode_macro M106]
description: Route the slicer's fan command to whichever head is active
rename_existing: M106.1
gcode:
    {% set s = (params.S|default(255)|float) / 255.0 %}
    {% if printer.toolhead.extruder == 'extruder1' %}
        SET_FAN_SPEED FAN=fan_part_B SPEED={s}
    {% else %}
        SET_FAN_SPEED FAN=fan_part_A SPEED={s}
    {% endif %}

[gcode_macro M107]
rename_existing: M107.1
gcode:
    {% if printer.toolhead.extruder == 'extruder1' %}
        SET_FAN_SPEED FAN=fan_part_B SPEED=0
    {% else %}
        SET_FAN_SPEED FAN=fan_part_A SPEED=0
    {% endif %}
