#  IDEX 3D printer - Klipper configuration
#  ---------------------------------------
#  Board : BIGTREETECH Manta M8P V2.0  (STM32H723, 128KiB bootloader, 25 MHz crystal)
#  Host  : BTT CB1 (or Raspberry Pi CM4) in the Manta's compute socket
#  Supply: 24 V
#
#  Pin assignments are taken verbatim from BigTreeTech's own reference config:
#  https://github.com/bigtreetech/Manta-M8P/blob/master/V2.0/Firmware/generic-bigtreetech-manta-m8p-V2_0.cfg
#  Nothing here is guessed. Machine-specific numbers come from the parametric
#  Fusion model in ../cad - see ../docs/design-notes.md.
#
#  Motor slots used:
#    Motor1 -> X   (toolhead A, left)
#    Motor2 -> Y   (bed)
#    Motor3 -> Z   (one motor, belt-linked to BOTH lead screws)
#    Motor4 -> dual_carriage (toolhead B, right)
#    Motor5 -> extruder  (toolhead A, Orbiter v2.5)
#    Motor6 -> extruder1 (toolhead B, Orbiter v2.5)
#  Two slots (Motor7, Motor8) stay free.
#
#  ####################################################################
#  BEFORE FIRST POWER-ON, read ../docs/design-notes.md "Commissioning".
#  Every temperature, current and endstop position below must be checked
#  against the machine you actually built. PID values are placeholders.
#  ####################################################################

[mcu]
# Replace with the real path from: ls /dev/serial/by-id/*
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_CHANGE-ME-if00

[printer]
kinematics: cartesian
max_velocity: 400
# 3800 mm/s2 is the BED's structural limit, and the bed is the slowest axis.
# The X toolhead models out at ~13,200 mm/s2, so X has large headroom that a
# single global max_accel cannot use. Raising this means stiffening the bed
# first - see design-notes.md.
max_accel: 3800
max_z_velocity: 15
max_z_accel: 200
square_corner_velocity: 5.0


# ===========================================================================
#  X  -  toolhead A (left).  GT2 20T on a NEMA 17 -> 40 mm/rev.
# ===========================================================================
[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 32
rotation_distance: 40
endstop_pin: ^PF4
# X=0 is the left edge of the build area. Toolhead A parks 35 mm left of it.
position_endstop: -35
position_min: -35
position_max: 230
homing_speed: 60
homing_positive_dir: false

[tmc2209 stepper_x]
uart_pin: PC13
run_current: 0.800
stealthchop_threshold: 0


# ===========================================================================
#  dual_carriage  -  toolhead B (right), Motor4
# ===========================================================================
[dual_carriage]
axis: x
step_pin: PB4
dir_pin: PB3
enable_pin: !PB6
microsteps: 32
rotation_distance: 40
endstop_pin: ^PF1
# Toolhead B parks 35 mm right of the build area (230 + 35).
position_endstop: 265
position_min: 0
position_max: 265
homing_speed: 60
homing_positive_dir: true
# Carriage plates are 110 mm wide, so the nozzles can never be closer than that.
safe_distance: 110

[tmc2209 dual_carriage]
uart_pin: PB5
run_current: 0.800
stealthchop_threshold: 0


# ===========================================================================
#  Y  -  the bed.  Moving mass ~1.83 kg; this is the machine's slowest axis.
# ===========================================================================
[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 32
rotation_distance: 40
endstop_pin: ^PF3
position_endstop: 0
position_min: 0
position_max: 235
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PE3
run_current: 0.900
stealthchop_threshold: 0


# ===========================================================================
#  Z  -  ONE motor, belt-linked to both TR8x8 lead screws (20T : 20T, 1:1).
#        Because the screws are belt-linked they cannot lose sync relative to
#        each other, so this is a single [stepper_z] - NOT z_tilt.
# ===========================================================================
[stepper_z]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0
microsteps: 32
rotation_distance: 8          # TR8x8 = 8 mm lead, 1:1 belt
endstop_pin: ^PF2
position_endstop: 0
position_max: 230
position_min: -2
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PB9
run_current: 0.650
stealthchop_threshold: 999999


# ===========================================================================
#  Extruders - LDO Orbiter v2.5 on each toolhead
# ===========================================================================
[extruder]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15
microsteps: 32
rotation_distance: 4.637      # Orbiter v2.5 nominal - CALIBRATE before printing
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA0               # HE0
sensor_pin: PB0               # T0
sensor_type: Generic 3950
min_temp: 0
max_temp: 285
max_extrude_only_distance: 150
pressure_advance: 0.040       # placeholder - tune per filament
pressure_advance_smooth_time: 0.040
control: pid                  # placeholder - run PID_CALIBRATE
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114

[tmc2209 extruder]
uart_pin: PG14
run_current: 0.650
stealthchop_threshold: 0

[extruder1]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
microsteps: 32
rotation_distance: 4.637
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1               # HE1
sensor_pin: PC5               # T1
sensor_type: Generic 3950
min_temp: 0
max_temp: 285
max_extrude_only_distance: 150
pressure_advance: 0.040
pressure_advance_smooth_time: 0.040
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114

[tmc2209 extruder1]
uart_pin: PG10
run_current: 0.650
stealthchop_threshold: 0


# ===========================================================================
#  Bed  -  235 x 235 aluminium plate, 24 V
# ===========================================================================
[heater_bed]
heater_pin: PF5
sensor_pin: PB1               # TB
sensor_type: Generic 3950     # check against the bed you actually buy
control: pid                  # placeholder - run PID_CALIBRATE
pid_Kp: 54.0
pid_Ki: 0.77
pid_Kd: 948
min_temp: 0
max_temp: 120


# ===========================================================================
#  Fans
# ===========================================================================
[fan_generic fan_part_A]
pin: PF7                      # Fan0 - 5015 part cooling, toolhead A
cycle_time: 0.010

[fan_generic fan_part_B]
pin: PF9                      # Fan1 - 5015 part cooling, toolhead B
cycle_time: 0.010

[heater_fan hotend_fan_A]
pin: PF6                      # Fan2 - 4010 heatsink, toolhead A
heater: extruder
heater_temp: 50.0

[heater_fan hotend_fan_B]
pin: PF8                      # Fan3 - 4010 heatsink, toolhead B
heater: extruder1
heater_temp: 50.0


# ===========================================================================
#  Input shaping  -  the whole point of the rebuild
# ===========================================================================
[adxl345]
cs_pin: PA15
spi_bus: spi3a

[resonance_tester]
accel_chip: adxl345
# Centre of the build area.
probe_points: 115, 117, 50

[input_shaper]
# Run SHAPER_CALIBRATE for EACH toolhead and fill these in.
# The model predicts roughly 77 Hz on X and 42 Hz on Y; if the measured
# numbers are far from that, the machine is not built the way it is drawn.
#shaper_type_x: mzv
#shaper_freq_x: 77.0
#shaper_type_y: mzv
#shaper_freq_y: 42.0


# ===========================================================================
#  Housekeeping
# ===========================================================================
[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]
[pause_resume]
[exclude_object]
[respond]

[idle_timeout]
timeout: 1800

[force_move]
enable_force_move: True

[board_pins]
aliases:
    EXP1_1=PE7,  EXP1_2=PG1,
    EXP1_3=PG0,  EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,
    EXP2_7=PE8,  EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>

[include idex-macros.cfg]
