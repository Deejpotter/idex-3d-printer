#  IDEX 3D printer - Klipper configuration
#  ---------------------------------------
#  Board : BIGTREETECH Octopus Pro V1.1 (H723)
#          Compile for STM32H723, 128KiB bootloader, 25 MHz crystal, USB on PA11/PA12.
#  Host  : Raspberry Pi over USB
#  Supply: 24 V
#
#  Pin assignments are taken verbatim from BigTreeTech's own reference config:
#  https://github.com/bigtreetech/BIGTREETECH-OCTOPUS-V1.0/blob/master/Firmware/Klipper/generic-bigtreetech-octopus-pro-v1.1.cfg
#  The one departure is noted at Driver3 below. Machine numbers come from the
#  parametric Fusion model in ../cad - see ../docs/design-notes.md.
#
#  Driver allocation (8 slots, 6 used):
#    Driver0 -> X   (toolhead A, left)
#    Driver1 -> Y   (bed)
#    Driver2 -> Z   (one motor, belt-linked to BOTH lead screws)
#    Driver3 -> dual_carriage (toolhead B, right)
#    Driver4 -> extruder  (toolhead A, Orbiter v2.5)
#    Driver5 -> extruder1 (toolhead B, Orbiter v2.5)
#
#  ####################################################################
#  NOTHING HERE HAS RUN ON HARDWARE. Read ../docs/design-notes.md
#  "Commissioning" before powering anything. Every PID value is a
#  placeholder and every endstop position comes from the model.
#  ####################################################################

[mcu]
# Replace with the real path from: ls /dev/serial/by-id/*
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_CHANGE-ME-if00

[printer]
kinematics: cartesian
max_velocity: 400
# 5600 mm/s2 is the BED's structural limit, and the bed is still the slowest
# axis. The X toolhead models out at ~13,200 mm/s2, so X has headroom a single
# global max_accel cannot use. Raising this means stiffening the bed further.
# Was 5900 against a 1.27 kg bed; the in-stock 255 x 245 heated plate adds 68 g
# (docs/design-notes.md 21), which takes the bed limit to ~5,650 mm/s2.
# CAUTION: that 5,650 inherits a carrier stiffness that cannot be reproduced
# from its own stated method (docs/design-notes.md 23). The Y chain is ~95%
# belt clamp, and the real limit is somewhere between 990 and 8,817 mm/s2
# depending on how that clamp is built. Measure it: run RESONANCE_TEST on Y
# before trusting this number in either direction.
max_accel: 5600
max_z_velocity: 15
max_z_accel: 200
square_corner_velocity: 5.0


# ===========================================================================
#  Driver0 - X, toolhead A (left).  GT2 20T on a NEMA 17 -> 40 mm/rev.
# ===========================================================================
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 32
rotation_distance: 40
endstop_pin: PG6
# X=0 is the left edge of the build area. Toolhead A parks 35 mm left of it.
position_endstop: -35
position_min: -35
position_max: 230
homing_speed: 60
homing_positive_dir: false

[tmc2209 stepper_x]
uart_pin: PC4
run_current: 0.800
stealthchop_threshold: 0


# ===========================================================================
#  Driver3 - dual_carriage, toolhead B (right)
# ===========================================================================
[dual_carriage]
axis: x
step_pin: PG4
dir_pin: PC1
# BTT's reference config writes this one without the leading '!', unlike every
# other driver on the board. TMC2209 enable is active low, so it is inverted
# here to match. Check the motor actually enables before trusting it.
enable_pin: !PA2
microsteps: 32
rotation_distance: 40
endstop_pin: PG11
# Toolhead B parks 35 mm right of the build area (230 + 35).
position_endstop: 265
position_min: 0
position_max: 265
homing_speed: 60
homing_positive_dir: true
# Carriage plates are 110 mm wide, so the nozzles can never be closer.
safe_distance: 110

[tmc2209 dual_carriage]
uart_pin: PC7
run_current: 0.800
stealthchop_threshold: 0


# ===========================================================================
#  Driver1 - Y, the bed.  Moving mass 1269 g.
# ===========================================================================
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 32
rotation_distance: 40
endstop_pin: PG9
position_endstop: 0
position_min: 0
position_max: 235
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PD11
run_current: 0.900
stealthchop_threshold: 0


# ===========================================================================
#  Driver2 - Z.  ONE motor, belt-linked to both TR8x8 lead screws (20T:20T).
#  Because the screws are belt-linked they cannot lose sync relative to each
#  other, so this is a single [stepper_z] - NOT z_tilt.
# ===========================================================================
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 32
rotation_distance: 8          # TR8x8 = 8 mm lead, 1:1 belt
endstop_pin: PG10
position_endstop: 0
position_max: 230
position_min: -2
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PC6
run_current: 0.650
stealthchop_threshold: 999999


# ===========================================================================
#  Driver4 / Driver5 - LDO Orbiter v2.5 on each toolhead
# ===========================================================================
[extruder]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 32
rotation_distance: 4.637      # Orbiter v2.5 nominal - CALIBRATE before printing
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA0               # HE0
sensor_pin: PF4               # T0
sensor_type: Generic 3950
min_temp: 0
max_temp: 285
max_extrude_only_distance: 150
pressure_advance: 0.040       # placeholder - tune per filament
pressure_advance_smooth_time: 0.040
control: pid                  # placeholder - run PID_CALIBRATE
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114

[tmc2209 extruder]
uart_pin: PF2
run_current: 0.650
stealthchop_threshold: 0

[extruder1]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
microsteps: 32
rotation_distance: 4.637
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA3               # HE1
sensor_pin: PF5               # T1
sensor_type: Generic 3950
min_temp: 0
max_temp: 285
max_extrude_only_distance: 150
pressure_advance: 0.040
pressure_advance_smooth_time: 0.040
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114

[tmc2209 extruder1]
uart_pin: PE4
run_current: 0.650
stealthchop_threshold: 0


# ===========================================================================
#  Bed - 235 x 235 aluminium plate with bonded heater, 24 V
# ===========================================================================
# The bed heater has its own 24 V supply (LRS-350-24); motion, hotends and the
# board run from a second LRS-200-24. See the power budget in docs/bom.md.
[heater_bed]
heater_pin: PA1
sensor_pin: PF3               # TB
sensor_type: Generic 3950     # check against the bed you actually buy
control: pid                  # placeholder - run PID_CALIBRATE
pid_Kp: 54.0
pid_Ki: 0.77
pid_Kd: 948
min_temp: 0
max_temp: 120


# ===========================================================================
#  Fans
# ===========================================================================
[fan_generic fan_part_A]
pin: PA8                      # FAN0 - 5015 part cooling, toolhead A
cycle_time: 0.010

[fan_generic fan_part_B]
pin: PE5                      # FAN1 - 5015 part cooling, toolhead B
cycle_time: 0.010

[heater_fan hotend_fan_A]
pin: PD12                     # FAN2 - 4010 heatsink, toolhead A
heater: extruder
heater_temp: 50.0

[heater_fan hotend_fan_B]
pin: PD13                     # FAN3 - 4010 heatsink, toolhead B
heater: extruder1
heater_temp: 50.0

[controller_fan board_fan]
pin: PD14                     # FAN4 - electronics bay
heater: heater_bed


# ===========================================================================
#  Input shaping - the whole point of the rebuild.
#  The Octopus Pro has no ADXL header, so the accelerometer goes on the Pi's
#  own SPI. That is one of the reasons this board plus a Pi beats the Manta
#  plus a compute module you cannot buy.
# ===========================================================================
[adxl345]
cs_pin: rpi:None
spi_speed: 2000000
spi_bus: spidev0.0

[resonance_tester]
accel_chip: adxl345
probe_points: 115, 117, 50    # centre of the build area

[input_shaper]
# Run SHAPER_CALIBRATE for EACH toolhead and fill these in.
# The model predicts roughly 77 Hz on X and 52 Hz on Y. If the measured
# numbers are far from that, the machine is not built the way it is drawn.
#shaper_type_x: mzv
#shaper_freq_x: 77.0
#shaper_type_y: mzv
#shaper_freq_y: 52.0


# ===========================================================================
#  Housekeeping
# ===========================================================================
[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]
[pause_resume]
[exclude_object]
[respond]

[idle_timeout]
timeout: 1800

[force_move]
enable_force_move: True

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8,  EXP1_2=PE7,
    EXP1_3=PE9,  EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PA6,  EXP2_2=PA5,
    EXP2_3=PB1,  EXP2_4=PA4,
    EXP2_5=PB2,  EXP2_6=PA7,
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PC5

[include idex-macros.cfg]
